apiVersion: v1
kind: ConfigMap
metadata:
  name: git-light
  namespace: git
data:
  nginx.conf: |
    server {
      listen 80;
      client_max_body_size 0;
      location / {
        include fastcgi_params;
        fastcgi_pass unix:/run/fcgiwrap.sock;
        fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT /srv/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO $uri;
        fastcgi_param REMOTE_USER $remote_user;
      }
    }
  start.sh: |
    set -e
    apk add --no-cache git git-daemon fcgiwrap spawn-fcgi >/dev/null
    # Lectura y escritura anonimas: el Service solo es accesible dentro del cluster o por port-forward
    git config --system http.receivepack true
    git config --system safe.directory '*'
    repo=/srv/git/lab/k3s-lab.git
    if [ ! -d "$repo" ]; then
      git init --bare -q -b main "$repo"
    fi
    spawn-fcgi -s /run/fcgiwrap.sock -U nginx -G nginx -- /usr/bin/fcgiwrap
    cp /config/nginx.conf /etc/nginx/conf.d/default.conf
    exec nginx -g 'daemon off;'
