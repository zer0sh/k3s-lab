name: Auto Rollback

# Necesita llegar a ArgoCD, que vive en el cluster local del lab:
# registra un self-hosted runner en la maquina del lab y define la variable
# de repo CLUSTER_RUNNER con su label (p.ej. "self-hosted").
# Sin ARGOCD_SERVER / ARGOCD_AUTH_TOKEN el workflow se salta sin fallar.

on:
  workflow_run:
    workflows: ["Build & Push Sample App"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      app_name:
        description: "ArgoCD app to rollback"
        required: true
        default: "sample-app"
        type: choice
        options:
          - sample-app
          - postgres
          - mysql
          - sonarqube
          - infrastructure

env:
  # Leidas directamente por el CLI de argocd
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
  # ArgoCD corre con server.insecure (HTTP detras de port-forward/ingress)
  ARGOCD_OPTS: "--grpc-web --plaintext"

jobs:
  health-check:
    name: Post-Deploy Health Check
    runs-on: ${{ vars.CLUSTER_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}
      app_name: ${{ steps.set-app.outputs.app_name }}
    steps:
      - name: Set app name
        id: set-app
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "app_name=${{ inputs.app_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "app_name=sample-app" >> "$GITHUB_OUTPUT"
          fi

      - name: Check configuration
        id: config
        run: |
          if [ -z "$ARGOCD_SERVER" ] || [ -z "$ARGOCD_AUTH_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## ⏭️ Health check skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "\`ARGOCD_SERVER\` / \`ARGOCD_AUTH_TOKEN\` not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ArgoCD CLI
        if: steps.config.outputs.configured == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL -o "$RUNNER_TEMP/bin/argocd" https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x "$RUNNER_TEMP/bin/argocd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Wait for ArgoCD sync
        if: steps.config.outputs.configured == 'true'
        run: |
          # Image Updater (poll ~2 min) + commit + sync de ArgoCD (poll ~3 min)
          argocd app wait ${{ steps.set-app.outputs.app_name }} --sync --health --timeout 600 || true

      - name: Check app health
        id: check
        if: steps.config.outputs.configured == 'true'
        run: |
          APP_JSON=$(argocd app get ${{ steps.set-app.outputs.app_name }} -o json)
          HEALTH=$(echo "$APP_JSON" | jq -r '.status.health.status')
          SYNC=$(echo "$APP_JSON" | jq -r '.status.sync.status')

          echo "health=${HEALTH}" >> "$GITHUB_OUTPUT"
          echo "sync=${SYNC}" >> "$GITHUB_OUTPUT"

          if [ "$HEALTH" == "Healthy" ] && [ "$SYNC" == "Synced" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate summary
        if: always() && steps.config.outputs.configured == 'true'
        run: |
          APP="${{ steps.set-app.outputs.app_name }}"
          HEALTHY="${{ steps.check.outputs.healthy }}"

          echo "## 🏥 Post-Deploy Health Check — \`${APP}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Health | \`${{ steps.check.outputs.health }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sync | \`${{ steps.check.outputs.sync }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$HEALTHY" == "true" ]; then
            echo "✅ **App is healthy. No rollback needed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⛔ **App is unhealthy. Triggering rollback...**" >> "$GITHUB_STEP_SUMMARY"
          fi

  rollback:
    name: Rollback
    runs-on: ${{ vars.CLUSTER_RUNNER || 'ubuntu-latest' }}
    needs: health-check
    if: needs.health-check.outputs.healthy == 'false'
    steps:
      - name: Install ArgoCD CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL -o "$RUNNER_TEMP/bin/argocd" https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x "$RUNNER_TEMP/bin/argocd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Get previous revision
        id: prev
        run: |
          PREV_ID=$(argocd app get ${{ needs.health-check.outputs.app_name }} -o json \
            | jq -r '.status.history[-2].id // empty')
          if [ -z "$PREV_ID" ]; then
            echo "No previous revision in ArgoCD history, cannot rollback." >&2
            exit 1
          fi
          echo "revision=${PREV_ID}" >> "$GITHUB_OUTPUT"

      - name: Disable auto-sync
        run: |
          # ArgoCD rechaza el rollback con auto-sync activo; ademas volveria a desplegar HEAD
          argocd app set ${{ needs.health-check.outputs.app_name }} --sync-policy none

      - name: Rollback app
        run: |
          argocd app rollback ${{ needs.health-check.outputs.app_name }} ${{ steps.prev.outputs.revision }}

      - name: Wait for rollback sync
        run: |
          argocd app wait ${{ needs.health-check.outputs.app_name }} --health --timeout 300

      - name: Generate summary
        if: always()
        run: |
          APP="${{ needs.health-check.outputs.app_name }}"
          REV="${{ steps.prev.outputs.revision }}"

          echo "## ⏪ Rollback Executed — \`${APP}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| App | \`${APP}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rolled back to | history id \`${REV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | Unhealthy after deploy |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ **Auto-sync is now disabled for \`${APP}\`.** Fix the change in Git, then re-enable it:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`argocd app set ${APP} --sync-policy automated --auto-prune --self-heal\`" >> "$GITHUB_STEP_SUMMARY"
