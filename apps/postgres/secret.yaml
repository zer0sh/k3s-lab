# Valores iniciales del lab. Para cambiarlos: make db-password TARGET=postgres|pgadmin
# (ArgoCD ignora los cambios en vivo de este Secret: ver argocd-apps/postgres.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: postgres
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin123
  POSTGRES_DB: devlab
  PGADMIN_DEFAULT_EMAIL: admin@devlab.com
  PGADMIN_DEFAULT_PASSWORD: admin123
