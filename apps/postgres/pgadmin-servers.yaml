apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: postgres
data:
  # Servidor preconfigurado en pgAdmin (se carga en cada arranque: pgAdmin no tiene volumen).
  # No guarda password: pgAdmin la pide al conectar.
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "PostgreSQL (lab)",
          "Group": "Servers",
          "Host": "postgres",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "admin",
          "SSLMode": "prefer"
        }
      }
    }
